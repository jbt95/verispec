# GitLab CI template for VeriSpec.
#
# Copy this file into your project (or include it) and point it at your spec:
#
#   include:
#     - project: verispec/verispec
#       file: ci/gitlab-ci.yml
#       inputs:
#         spec: specs/bank.verispec.yaml
#         traces: "specs/bank-trace.json"
#
# The job fails the pipeline when a counterexample is found. The artifacts
# contain the SARIF report and the HTML conformance report.

spec:
  description: "Path to the spec file"
  default: "specs/app.verispec.yaml"

traces:
  description: "Comma separated list of JSON traces to replay"
  default: ""

bound:
  description: "Bounded model checking bound"
  default: "10"

verispec:
  stage: test
  image: python:3.11-slim
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install "verispec==${VERISPEC_VERSION:-1.0.0}" || python -m pip install .
  script:
    - |
      set -e
      mkdir -p verispec-artifacts
      verispec validate "$SPEC" --format json > verispec-artifacts/validate.json
      set +e
      verispec check "$SPEC" --bound "$BOUND" --format json > verispec-artifacts/check.json
      check_code=$?
      verispec check "$SPEC" --bound "$BOUND" --format sarif > verispec-artifacts/verispec.sarif
      set -e
      verispec report "$SPEC" --bound "$BOUND" -o verispec-artifacts/report.html || true
      cat verispec-artifacts/check.json
      if [ "$check_code" -ne 0 ]; then
        echo "VeriSpec found a counterexample (see the report artifact)"
        exit 1
      fi
    - |
      if [ -n "$TRACES" ]; then
        status=0
        IFS=',' read -ra trace_list <<< "$TRACES"
        for trace in "${trace_list[@]}"; do
          trace="$(echo "$trace" | tr -d '[:space:]')"
          [ -z "$trace" ] && continue
          verispec check-trace "$SPEC" "$trace" || status=1
        done
        exit "$status"
      fi
  artifacts:
    when: always
    paths:
      - verispec-artifacts/
    reports:
      sast: verispec-artifacts/verispec.sarif
