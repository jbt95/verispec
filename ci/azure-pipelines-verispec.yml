# VeriSpec pipeline (Azure Pipelines) — CLI equivalent of the GitHub composite Action.
# Add as a pipeline file or template; set variables in the pipeline UI.

trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  VERISPEC_BOUND: "10"
  VERISPEC_TIMEOUT_MS: "30000"

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.11"

  - script: |
      python -m pip install --upgrade pip
      python -m pip install "verispec @ git+https://github.com/verispec/verispec.git@main"
      verispec version
    displayName: Install VeriSpec

  - script: |
      set -euo pipefail
      test -n "$(VERISPEC_SPEC)"
      verispec validate "$(VERISPEC_SPEC)"
      verispec lint "$(VERISPEC_SPEC)"
      verispec check "$(VERISPEC_SPEC)" --bound $(VERISPEC_BOUND) --timeout $(VERISPEC_TIMEOUT_MS)
      if [ -n "$(VERISPEC_TRACES)" ]; then
        IFS=',' read -ra traces <<< "$(VERISPEC_TRACES)"
        for t in "${traces[@]}"; do
          t="$(echo "$t" | tr -d '[:space:]')"
          [ -z "$t" ] && continue
          verispec check-trace "$(VERISPEC_SPEC)" "$t"
        done
      fi
      verispec report "$(VERISPEC_SPEC)" --bound $(VERISPEC_BOUND) -o verispec-report.html
    displayName: Verify spec and publish report
    env:
      VERISPEC_SPEC: $(VERISPEC_SPEC)
      VERISPEC_TRACES: $(VERISPEC_TRACES)

  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: verispec-report.html
      artifact: verispec-report
