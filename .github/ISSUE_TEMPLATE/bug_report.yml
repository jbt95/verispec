name: Bug report
description: Report a defect in VeriSpec, a wrong counterexample, or a broken adapter.
title: "[bug] "
labels:
  - bug
body:
  - type: dropdown
    id: kind
    attributes:
      label: "Kind of bug"
      description: "What kind of problem is this?"
      options:
        - "Spec error (the spec file is wrong, malformed, or rejected)"
        - "False positive counterexample (VeriSpec reports a violation that is not real)"
        - "CLI / tooling (a command crashes, misbehaves, or produces wrong output)"
        - "Adapter (a language adapter does not behave as the contract requires)"
        - "Other"
    validations:
      required: true
  - type: input
    id: spec-file
    attributes:
      label: "Spec file"
      description: "Path to the spec file in this repository, or a link to it if it lives elsewhere."
      placeholder: "examples/bank.yaml"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: "Exact command run"
      description: "The full command, copied and pasted, including flags."
      placeholder: "verispec check examples/bank.yaml --bound 10"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected output"
      description: "What you expected VeriSpec to do."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual output"
      description: "What VeriSpec actually did. Paste the full output, including the counterexample trace if there is one."
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "VeriSpec version"
      description: "Output of `verispec --version`, or the commit SHA if you run from source."
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: "Language and adapter"
      description: "The implementation language, and the adapter used (Python, TypeScript, Go, Rust, C, Java, other, or \"not applicable\" for a core bug)."
      placeholder: "Python (examples/bank_adapter.py)"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Additional context"
      description: "Anything else: environment, Python version, Z3 version, logs."
    validations:
      required: false
  - type: checkboxes
    id: attestation
    attributes:
      label: "Attestation"
      options:
        - label: "I did not modify the spec to work around the failure"
          required: true
        - label: "The spec is human-approved"
          required: true
        - label: "I checked that this is not already reported"
          required: false
