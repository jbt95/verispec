name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    name: Build the distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify tag and package versions
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          python - "$version" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          expected = sys.argv[1]
          actual = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if actual != expected:
              raise SystemExit(f"tag version {expected} does not match Python package version {actual}")
          PY
          node -e 'const p=require("./adapters/typescript/package.json"); if(p.version !== process.argv[1]) { console.error("tag version " + process.argv[1] + " does not match npm package version " + p.version); process.exit(1); }' "$version"
      - name: Build the Python distribution
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist
      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install --upgrade cyclonedx-bom
          cyclonedx-py environment --output-format json -o dist/verispec-sbom.cdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/verispec-sbom.cdx.json
      - name: Smoke test installed wheel and bundled registry
        run: |
          set -euo pipefail
          python -m pip install --no-deps --target "$RUNNER_TEMP/verispec-installed" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/verispec-installed" python - <<'PY'
          from verispec.registry import list_entries, load_registry

          entries = list_entries(load_registry())
          if not entries:
              raise SystemExit("installed wheel does not contain the VeriSpec registry")
          print(f"installed wheel registry entries: {len(entries)}")
          PY
      - name: Check the distributions
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - name: Build the npm package archive
        working-directory: adapters/typescript
        run: |
          set -euo pipefail
          npm ci
          npm run build
          mkdir -p "$RUNNER_TEMP/verispec-npm" "$GITHUB_WORKSPACE/npm-package"
          npm pack --pack-destination "$RUNNER_TEMP/verispec-npm"
          mv "$RUNNER_TEMP"/verispec-npm/*.tgz "$GITHUB_WORKSPACE/npm-package/verispec-adapter.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/verispec-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: npm-distribution
          path: npm-package/*.tgz

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: npm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-distribution
          path: npm-package
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish
        run: npm publish npm-package/verispec-adapter.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: GitHub release
    needs: [publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: npm-distribution
          path: npm-package
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/verispec-sbom.cdx.json
            npm-package/*.tgz
