name: "VeriSpec"
description: >-
  Verify a VeriSpec formal spec with bounded model checking and check that
  your implementation follows it. Reports a concrete counterexample on the
  pull request instead of a bare "test failed".
author: "VeriSpec contributors"
branding:
  icon: "shield"
  color: "blue"

inputs:
  spec:
    description: "Path to the spec file (.verispec.yaml)"
    required: true
  traces:
    description: "Comma separated list of JSON traces to replay against the spec"
    required: false
    default: ""
  bound:
    description: "Maximum number of steps explored by the bounded model checker"
    required: false
    default: "10"
  timeout-ms:
    description: "Solver timeout in milliseconds"
    required: false
    default: "30000"
  python-version:
    description: "Python version used to run VeriSpec"
    required: false
    default: "3.11"
  version:
    description: "VeriSpec version to install (empty = install from this repository)"
    required: false
    default: ""
  comment:
    description: "Comment the pull request with the counterexample"
    required: false
    default: "true"
  report:
    description: "Upload the HTML conformance report as a workflow artifact"
    required: false
    default: "true"
  require-spec-approval:
    description: >-
      Fail when the spec changed in this pull request and no human approved it
      (the label is configurable with the approval-label input).
    required: false
    default: "true"
  approval-label:
    description: "Label that marks a spec change as approved by a human"
    required: false
    default: "spec-approved"

outputs:
  result:
    description: "The JSON result of the check (status, violations, trace)"
    value: ${{ steps.check.outputs.result }}
  violated:
    description: "Comma separated list of violated invariants (empty when green)"
    value: ${{ steps.check.outputs.violated }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install VeriSpec
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.version }}" ]; then
          python -m pip install --upgrade "verispec==${{ inputs.version }}"
        else
          python -m pip install --upgrade .
        fi
        verispec version

    - name: Check that the spec has not been weakened
      if: ${{ inputs.require-spec-approval == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        SPEC: ${{ inputs.spec }}
        APPROVAL_LABEL: ${{ inputs.approval-label }}
      run: |
        set -euo pipefail
        base="${{ github.event.pull_request.base.sha }}"
        changed=$(git diff --name-only "$base" -- "$SPEC" || true)
        if [ -z "$changed" ]; then
          echo "the spec was not changed by this pull request"
          exit 0
        fi
        labels=$(gh pr view --json labels -q '.labels[].name' || true)
        if echo "$labels" | grep -Fxq "$APPROVAL_LABEL"; then
          echo "the spec changed and a human approved it (label: $APPROVAL_LABEL)"
          exit 0
        fi
        echo "::error::The spec ($SPEC) changed in this pull request and no human approved it."
        echo "The spec is human owned: add the '$APPROVAL_LABEL' label after a human review."
        exit 1

    - name: Check the spec
      id: check
      shell: bash
      env:
        SPEC: ${{ inputs.spec }}
        BOUND: ${{ inputs.bound }}
        TIMEOUT: ${{ inputs.timeout-ms }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/verispec"
        set +e
        verispec check "$SPEC" --bound "$BOUND" --timeout "$TIMEOUT" --format json \
          > "$RUNNER_TEMP/verispec/check.json"
        code=$?
        set -e
        cat "$RUNNER_TEMP/verispec/check.json"
        violated=$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(','.join(d.get('violated') or []))" "$RUNNER_TEMP/verispec/check.json")
        echo "result=$RUNNER_TEMP/verispec/check.json" >> "$GITHUB_OUTPUT"
        echo "violated=$violated" >> "$GITHUB_OUTPUT"
        if [ "$code" -eq 2 ] || [ "$code" -eq 3 ]; then
          echo "::error::VeriSpec could not check the spec (exit $code)"
          exit "$code"
        fi
        exit 0

    - name: Check the traces
      if: ${{ inputs.traces != '' }}
      shell: bash
      env:
        SPEC: ${{ inputs.spec }}
        TRACES: ${{ inputs.traces }}
      run: |
        set -euo pipefail
        status=0
        IFS=',' read -ra trace_list <<< "$TRACES"
        for trace in "${trace_list[@]}"; do
          trace="$(echo "$trace" | tr -d '[:space:]')"
          [ -z "$trace" ] && continue
          echo "::group::check-trace $trace"
          if ! verispec check-trace "$SPEC" "$trace"; then
            status=1
          fi
          echo "::endgroup::"
        done
        exit "$status"

    - name: Write the SARIF report
      if: ${{ always() && github.event_name != '' }}
      shell: bash
      env:
        SPEC: ${{ inputs.spec }}
        BOUND: ${{ inputs.bound }}
        TIMEOUT: ${{ inputs.timeout-ms }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/verispec"
        set +e
        verispec check "$SPEC" --bound "$BOUND" --timeout "$TIMEOUT" --format sarif \
          > "$RUNNER_TEMP/verispec/verispec.sarif"
        set -e
        test -s "$RUNNER_TEMP/verispec/verispec.sarif" || echo '{}' > "$RUNNER_TEMP/verispec/verispec.sarif"

    - name: Upload the SARIF report
      if: ${{ always() && github.event_name != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/verispec/verispec.sarif
        category: verispec

    - name: Write the HTML report
      if: ${{ inputs.report == 'true' }}
      shell: bash
      env:
        SPEC: ${{ inputs.spec }}
        BOUND: ${{ inputs.bound }}
      run: |
        set -euo pipefail
        set +e
        verispec report "$SPEC" --bound "$BOUND" -o "$RUNNER_TEMP/verispec/report.html"
        set -e
        test -f "$RUNNER_TEMP/verispec/report.html" || echo "<html><body>no report</body></html>" > "$RUNNER_TEMP/verispec/report.html"

    - name: Upload the HTML report
      if: ${{ inputs.report == 'true' && always() }}
      uses: actions/upload-artifact@v4
      with:
        name: verispec-report
        path: ${{ runner.temp }}/verispec/report.html
        if-no-files-found: warn

    - name: Comment the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      env:
        SPEC: ${{ inputs.spec }}
        RESULT_FILE: ${{ runner.temp }}/verispec/check.json
      with:
        script: |
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync(process.env.RESULT_FILE, 'utf8'));
          const marker = '<!-- verispec -->';
          const body = [];
          body.push(marker);
          body.push('## VeriSpec');
          body.push('');
          if (result.status === 'ok') {
            body.push(`No invariant was violated up to bound ${result.bound}.`);
            body.push('');
            body.push(`Guarantee: \`${result.guarantee}\` - a bounded claim, not a proof for all depths.`);
          } else {
            body.push(`**A counterexample was found** (bound ${result.bound}, guarantee \`${result.guarantee}\`).`);
            body.push('');
            body.push('Violated: ' + (result.violated || []).map((v) => `\`${v}\``).join(', '));
            body.push('');
            const trace = result.trace || [];
            body.push('| Step | Action | Params | State |');
            body.push('| --- | --- | --- | --- |');
            for (const step of trace) {
              body.push(`| ${step.step} | ${step.action || ''} | \`${JSON.stringify(step.params || {})}\` | \`${JSON.stringify(step.state || {})}\` |`);
            }
            body.push('');
            body.push('Reproduce it, fix the implementation, and re-run. Do not weaken the spec.');
          }
          body.push('');
          body.push(`Spec: \`${process.env.SPEC}\` (digest \`${result.spec.digest}\`)`);
          const comment = body.join('\n');
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const existing = await github.rest.issues.listComments({
            owner, repo, issue_number,
          });
          const previous = existing.data.find((c) => c.body && c.body.includes(marker));
          if (previous) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body: comment });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body: comment });
          }

    - name: Fail when the contract is broken
      shell: bash
      env:
        SPEC: ${{ inputs.spec }}
        BOUND: ${{ inputs.bound }}
        TIMEOUT: ${{ inputs.timeout-ms }}
      run: |
        set -euo pipefail
        verispec check "$SPEC" --bound "$BOUND" --timeout "$TIMEOUT"
