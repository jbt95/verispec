name: "VeriSpec"
description: >-
  Verify a VeriSpec formal spec with bounded model checking and check that
  your implementation follows it. Reports a concrete counterexample on the
  pull request instead of a bare "test failed".
author: "VeriSpec contributors"
branding:
  icon: "shield"
  color: "blue"

inputs:
  spec:
    description: "Path to the spec file (.verispec.yaml)"
    required: true
  traces:
    description: "Comma separated list of JSON traces to replay against the spec"
    required: false
    default: ""
  bound:
    description: "Maximum number of steps explored by the bounded model checker"
    required: false
    default: "10"
  timeout-ms:
    description: "Solver timeout in milliseconds"
    required: false
    default: "30000"
  python-version:
    description: "Python version used to run VeriSpec"
    required: false
    default: "3.11"
  version:
    description: "Pinned VeriSpec version to install (empty = use the package bundled with this action)"
    required: false
    default: ""
  comment:
    description: "Comment the pull request with the counterexample"
    required: false
    default: "true"
  report:
    description: "Upload the HTML conformance report as a workflow artifact"
    required: false
    default: "true"
  require-spec-approval:
    description: >-
      Require a label and non-author human approval review on the current PR commit
      when the spec or an imported spec changes.
    required: false
    default: "true"
  approval-label:
    description: "Label that marks a spec change as approved by a human"
    required: false
    default: "spec-approved"
  drift-check:
    description: >-
      On pull requests, run verispec drift between base and head and annotate
      the PR when implementation and spec mappings diverge (requires action
      `implements` entries in the spec).
    required: false
    default: "false"

outputs:
  result:
    description: "Path to the JSON result file (status, violations, trace)"
    value: ${{ steps.check.outputs.result }}
  violated:
    description: "Comma separated list of violated invariants (empty when green)"
    value: ${{ steps.check.outputs.violated }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install VeriSpec
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -n "$VERSION" ]; then
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}([a-zA-Z0-9.+-]*)?$ ]]; then
            echo "::error::version must be a pinned semantic version"
            exit 2
          fi
          python -m pip install --upgrade "verispec==$VERSION"
        else
          python -m pip install --upgrade "$ACTION_PATH"
        fi
        verispec version

    - name: Check that the spec has not been weakened
      if: ${{ inputs.require-spec-approval == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        SPEC: ${{ inputs.spec }}
        APPROVAL_LABEL: ${{ inputs.approval-label }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/verispec"
        rm -f "$RUNNER_TEMP/verispec/spec-changed"
        if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
        fi
        git diff --name-only -z "$BASE_SHA" -- > "$RUNNER_TEMP/verispec/changed-files"
        python - <<'PY'
        import os
        from pathlib import Path
        import yaml

        root = Path.cwd().resolve()
        entry = (root / os.environ["SPEC"]).resolve()
        try:
            entry.relative_to(root)
        except ValueError:
            raise SystemExit("spec must be inside the checked-out repository")

        changed_path = Path(os.environ["RUNNER_TEMP"], "verispec/changed-files")
        changed = {
            Path(name.decode()).as_posix()
            for name in changed_path.read_bytes().split(b"\0")
            if name
        }
        pending = [entry]
        visited = set()
        while pending:
            path = pending.pop().resolve()
            if path in visited:
                continue
            try:
                path.relative_to(root)
            except ValueError:
                raise SystemExit(f"imported spec is outside the repository: {path}")
            visited.add(path)
            try:
                data = yaml.safe_load(path.read_text())
            except (OSError, yaml.YAMLError) as error:
                raise SystemExit(f"cannot inspect spec dependency {path}: {error}")
            if not isinstance(data, dict):
                raise SystemExit(f"spec dependency is not a mapping: {path}")
            imports = data.get("imports") or []
            if not isinstance(imports, list):
                raise SystemExit(f"invalid imports in {path}")
            for item in imports:
                if not isinstance(item, dict) or not isinstance(item.get("path"), str):
                    raise SystemExit(f"invalid import in {path}")
                pending.append((path.parent / item["path"]).resolve())

        dependencies = {path.relative_to(root).as_posix() for path in visited}
        affected = sorted(changed.intersection(dependencies))
        if affected:
            print("Changed spec dependencies:")
            print("\n".join(affected))
            Path(os.environ["RUNNER_TEMP"], "verispec/spec-changed").write_text("yes")
        else:
            print("No spec or imported dependency changed.")
        PY
        if [ ! -f "$RUNNER_TEMP/verispec/spec-changed" ]; then
          exit 0
        fi
        if ! gh pr view "$PR_NUMBER" --json labels -q '.labels[].name' | grep -Fxq "$APPROVAL_LABEL"; then
          echo "::error::A spec or imported spec changed and no approval label was found."
          echo "Add the '$APPROVAL_LABEL' label after a human review."
          exit 1
        fi
        gh pr view "$PR_NUMBER" --json headRefOid,baseRefOid > "$RUNNER_TEMP/verispec/pr-refs.json"
        python - "$BASE_SHA" "$EVENT_HEAD_SHA" "$RUNNER_TEMP/verispec/pr-refs.json" <<'PY'
        import json
        import sys

        event_base, event_head, refs_path = sys.argv[1:]
        refs = json.loads(open(refs_path).read())
        if refs.get("headRefOid") != event_head or refs.get("baseRefOid") != event_base:
            raise SystemExit("The PR changed while this check was running; rerun against its latest refs.")
        PY
        head_sha="$EVENT_HEAD_SHA"
        gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
          > "$RUNNER_TEMP/verispec/reviews.json"
        if ! python - "$head_sha" "$RUNNER_TEMP/verispec/reviews.json" <<'PY'
        import json
        import os
        import sys
        head_sha, review_path = sys.argv[1:]
        pr_author = os.environ["PR_AUTHOR"]
        pages = json.loads(open(review_path).read())
        reviews = [review for page in pages for review in page]
        latest = {}
        for review in reviews:
            user = review.get("user") or {}
            if review.get("commit_id") != head_sha or user.get("type") == "Bot":
                continue
            login = user.get("login")
            if not login or login == pr_author:
                continue
            previous = latest.get(login)
            if previous is None or (review.get("submitted_at") or "") > (previous.get("submitted_at") or ""):
                latest[login] = review
        if not any(review.get("state") == "APPROVED" for review in latest.values()):
            raise SystemExit("No human approval review applies to the current PR head commit.")
        PY
        then
          echo "::error::A spec or imported spec changed without a human review of the current commit."
          exit 1
        fi
        echo "The changed spec dependency has approval and a human review on the current commit."

    - name: Check the spec
      id: check
      shell: bash
      env:
        SPEC: ${{ inputs.spec }}
        BOUND: ${{ inputs.bound }}
        TIMEOUT: ${{ inputs.timeout-ms }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/verispec"
        set +e
        verispec check "$SPEC" --bound "$BOUND" --timeout "$TIMEOUT" --format json \
          > "$RUNNER_TEMP/verispec/check.json"
        code=$?
        set -e
        cat "$RUNNER_TEMP/verispec/check.json"
        violated=$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(','.join(d.get('violated') or []))" "$RUNNER_TEMP/verispec/check.json")
        echo "result=$RUNNER_TEMP/verispec/check.json" >> "$GITHUB_OUTPUT"
        echo "violated=$violated" >> "$GITHUB_OUTPUT"
        if [ "$code" -eq 2 ] || [ "$code" -eq 3 ]; then
          echo "::error::VeriSpec could not check the spec (exit $code)"
          exit "$code"
        fi
        exit 0

    - name: Check spec vs implementation drift
      if: ${{ inputs.drift-check == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        SPEC: ${{ inputs.spec }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
        fi
        set +e
        verispec drift "$SPEC" --base "$BASE_SHA" --head "$HEAD_SHA" --format text
        code=$?
        set -e
        verispec drift "$SPEC" --base "$BASE_SHA" --head "$HEAD_SHA" --format sarif \
          > "$RUNNER_TEMP/verispec/drift.sarif" || true
        if [ "$code" -ne 0 ]; then
          echo "::warning::VeriSpec drift check reported spec/implementation mismatch (exit $code)"
          if [ -s "$RUNNER_TEMP/verispec/drift.sarif" ]; then
            python - <<'PY'
        import json, os
        path = os.path.join(os.environ["RUNNER_TEMP"], "verispec/drift.sarif")
        data = json.load(open(path))
        for run in data.get("runs") or []:
            for result in run.get("results") or []:
                msg = result.get("message", {}).get("text", "drift")
                print(f"::warning title=VeriSpec drift::{msg}")
        PY
          fi
          exit "$code"
        fi

    - name: Check the traces
      if: ${{ inputs.traces != '' }}
      shell: bash
      env:
        SPEC: ${{ inputs.spec }}
        TRACES: ${{ inputs.traces }}
      run: |
        set -euo pipefail
        status=0
        IFS=',' read -ra trace_list <<< "$TRACES"
        for trace in "${trace_list[@]}"; do
          trace="$(echo "$trace" | tr -d '[:space:]')"
          [ -z "$trace" ] && continue
          echo "::group::check-trace $trace"
          if ! verispec check-trace "$SPEC" "$trace"; then
            status=1
          fi
          echo "::endgroup::"
        done
        exit "$status"

    - name: Write the SARIF report
      if: ${{ always() && github.event_name != '' }}
      shell: bash
      env:
        SPEC: ${{ inputs.spec }}
        BOUND: ${{ inputs.bound }}
        TIMEOUT: ${{ inputs.timeout-ms }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/verispec"
        set +e
        verispec check "$SPEC" --bound "$BOUND" --timeout "$TIMEOUT" --format sarif \
          > "$RUNNER_TEMP/verispec/verispec.sarif"
        set -e
        test -s "$RUNNER_TEMP/verispec/verispec.sarif" || echo '{}' > "$RUNNER_TEMP/verispec/verispec.sarif"

    - name: Upload the SARIF report
      if: ${{ always() && github.event_name != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/verispec/verispec.sarif
        category: verispec

    - name: Write the HTML report
      if: ${{ inputs.report == 'true' }}
      shell: bash
      env:
        SPEC: ${{ inputs.spec }}
        BOUND: ${{ inputs.bound }}
      run: |
        set -euo pipefail
        set +e
        verispec report "$SPEC" --bound "$BOUND" -o "$RUNNER_TEMP/verispec/report.html"
        set -e
        test -f "$RUNNER_TEMP/verispec/report.html" || echo "<html><body>no report</body></html>" > "$RUNNER_TEMP/verispec/report.html"

    - name: Upload the HTML report
      if: ${{ inputs.report == 'true' && always() }}
      uses: actions/upload-artifact@v4
      with:
        name: verispec-report
        path: ${{ runner.temp }}/verispec/report.html
        if-no-files-found: warn

    - name: Comment the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      env:
        SPEC: ${{ inputs.spec }}
        RESULT_FILE: ${{ runner.temp }}/verispec/check.json
      with:
        script: |
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync(process.env.RESULT_FILE, 'utf8'));
          const marker = '<!-- verispec -->';
          const body = [];
          body.push(marker);
          body.push('## VeriSpec');
          body.push('');
          if (result.status === 'ok') {
            body.push(`No invariant was violated up to bound ${result.bound}.`);
            body.push('');
            body.push(`Guarantee: \`${result.guarantee}\` - a bounded claim, not a proof for all depths.`);
          } else {
            if (result.status !== 'violation') {
              body.push(`**The checker could not decide** at bound ${result.bound}.`);
              body.push(result.message || 'The result is unknown; this is not a proof.');
            } else {
              body.push(`**A counterexample was found** (bound ${result.bound}, guarantee \`${result.guarantee}\`).`);
            body.push('');
            body.push('Violated: ' + (result.violated || []).map((v) => `\`${v}\``).join(', '));
            body.push('');
            const trace = result.trace || [];
            body.push('| Step | Action | Params | State |');
            body.push('| --- | --- | --- | --- |');
            for (const step of trace) {
              body.push(`| ${step.step} | ${step.action || ''} | \`${JSON.stringify(step.params || {})}\` | \`${JSON.stringify(step.state || {})}\` |`);
            }
            body.push('');
              body.push('Reproduce it, fix the implementation, and re-run. Do not weaken the spec.');
            }
          }
          body.push('');
          body.push(`Spec: \`${process.env.SPEC}\` (digest \`${result.spec.digest}\`)`);
          const comment = body.join('\n');
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const existing = await github.rest.issues.listComments({
            owner, repo, issue_number,
          });
          const previous = existing.data.find((c) => c.body && c.body.includes(marker));
          if (previous) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body: comment });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body: comment });
          }

    - name: Fail when the contract is broken
      shell: bash
      env:
        SPEC: ${{ inputs.spec }}
        BOUND: ${{ inputs.bound }}
        TIMEOUT: ${{ inputs.timeout-ms }}
      run: |
        set -euo pipefail
        verispec check "$SPEC" --bound "$BOUND" --timeout "$TIMEOUT"
